worker_processes auto;
error_log /dev/stderr info;

events { worker_connections 1024; }

http {
    include mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;

    lua_package_path "/etc/nginx/lua/?.lua;;";

    server {
        listen 443 ssl http2;
        server_name 172.18.0.50 localhost gps.local;

        ssl_certificate     /etc/nginx/certs/172.18.0.50+2.pem;
        ssl_certificate_key /etc/nginx/certs/172.18.0.50+2-key.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;

        # Root → redirect to login
        location = / {
            return 302 /login;
        }

        # Login page
        location = /login {
            set $gps_page "login";
            content_by_lua_file /etc/nginx/lua/sign_page.lua;
        }

        # Account summary
        location = /account {
            set $gps_page "account";
            content_by_lua_file /etc/nginx/lua/sign_page.lua;
        }

        # Statement
        location = /statement {
            set $gps_page "statement";
            content_by_lua_file /etc/nginx/lua/sign_page.lua;
        }

        # Real website index
        location = /realwebsite {
            set $gps_page "realwebsite/index";
            content_by_lua_file /etc/nginx/lua/sign_page.lua;
        }

        # Demo pages under realwebsite/. The directory once held verbatim saved copies
        # of a real bank's site; those were removed on 2026-09-07 before publication
        # (third-party branding, their tracking scripts, and login forms posting to
        # their real domains). /homepage and /real-login served two of those copies and
        # nothing referenced them, so both routes are gone with the files. /mypage and
        # /balancepage are documented correctness cases and now serve neutral
        # GPS Demo Bank pages carrying the same fields.
        location = /mypage {
            set $gps_page "realwebsite/mypage";
            content_by_lua_file /etc/nginx/lua/sign_page.lua;
        }

        location = /balancepage {
            set $gps_page "realwebsite/balancepage";
            content_by_lua_file /etc/nginx/lua/sign_page.lua;
        }

        # PDF served with RFC 9421 signature
        location = /comprovativo.pdf {
            set $gps_page "realwebsite/comprovativo.pdf";
            content_by_lua_file /etc/nginx/lua/sign_pdf.lua;
        }

        # Static assets
        location /static/ {
            root /etc/nginx/html;
            add_header Access-Control-Allow-Origin *;
        }

        # Key registry (v2 distribution): the root-signed map of origin leaf keys.
        # A verifier/relying party fetches this; the guest checks each entry's root
        # signature in-circuit. Rotating a leaf key = republish here, no new image_id.
        location = /.well-known/gps-keys {
            default_type application/json;
            alias /etc/nginx/html/.well-known/gps-keys.json;
            add_header Access-Control-Allow-Origin *;
        }

        # Health check
        location /health {
            return 200 "GPS Server OK\n";
            add_header Content-Type text/plain;
        }

        # Favicon, serve empty to avoid 404 noise
        location = /favicon.ico {
            return 204;
        }
    }
}
