[package]
name = "gps-guest"
version = "0.1.0"
edition = "2021"

[dependencies]
risc0-zkvm = { version = "3.0.5", default-features = false, features = ["std"] }
gps-core = { path = "../../gps-core" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
sha2 = { version = "=0.10.8", default-features = false }
base64 = "0.22"
p256 = { version = "=0.13.2", features = ["ecdsa", "pem", "pkcs8"] }
crypto-bigint = { version = "=0.5.5", default-features = false }
regex = { version = "1", default-features = false, features = ["std"] }
hex = { version = "0.4", default-features = false }
flate2 = { version = "1.0", default-features = false, features = ["rust_backend"] }

[patch.crates-io]
p256 = { git = "https://github.com/risc0/RustCrypto-elliptic-curves", tag = "p256/v0.13.2-risczero.1" }
sha2 = { git = "https://github.com/risc0/RustCrypto-hashes", tag = "sha2-v0.10.8-risczero.0" }
crypto-bigint = { git = "https://github.com/risc0/RustCrypto-crypto-bigint", tag = "v0.5.5-risczero.0" }

[workspace]
